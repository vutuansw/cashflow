<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15803d">
<title>Mất kết nối · Quỹ nhóm</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f6; --fg: #111827; --muted: #4b5563; --primary: #15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1412; --fg: #e8ece9; --muted: #a3ada7; --primary: #22c55e; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Mất kết nối mạng</h1>
  <p>Quỹ nhóm cần mạng để xem và ghi thu chi.<br>Bạn kiểm tra wifi hoặc 4G rồi thử lại nhé.</p>
  <button type="button" onclick="location.reload()">Thử lại</button>
</main>
</body>
</html>
