; Hàng đợi WePo (email gộp, đọc bill). Chép vào /etc/supervisor/conf.d/ rồi supervisorctl reread && update.
[program:wepo-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.4 /var/www/wepo/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/wepo
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/wepo/storage/logs/worker.log
stopwaitsecs=3600
